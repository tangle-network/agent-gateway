name: Publish

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: verify (Node ${{ matrix.node-version }})
    runs-on: [self-hosted, ci-public]
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.18.0, 22.13.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify tag/version lock
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
              exit 1
            fi
          fi
          echo "Version locked: $NPM_VERSION"

  # Decides on the self-hosted runners whether this tag publishes: a tagged
  # version already on the registry skips the hosted publish job.
  registry-check:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, ci-public]
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check registry for the tagged version
        id: registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # npm trusted publishing accepts OIDC only from GitHub-hosted runners.
  publish-npm:
    needs: registry-check
    if: needs.registry-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Do not set registry-url. It creates a placeholder token config
          # that overrides npm trusted publishing.

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
